<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Para ti</title>
<meta name="description" content="Toca la pantalla.">
<meta name="theme-color" content="#140a1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Manrope:wght@500;700&display=swap">
<style>
/* Un jardín de tulipanes al anochecer que se vuelve corazón, luego palabras, y al final una carta. */
:root{
  --dusk:#140a1c; --ink:#fbeef3; --soft:#d2b3c3; --rose:#ff7a98; --gold:#ffcf6e;
  --paper:#fff8f1; --paper-ink:#3a1c27; --paper-soft:#8a6470; --leaf:#4f9a4a;
  --f-display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --f-body:"Newsreader",Georgia,serif;
  --f-ui:"Manrope",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--dusk);color:var(--ink);font-family:var(--f-ui);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}

.intro{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 16vh);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:0 20px;pointer-events:none;transition:opacity .9s ease}
.intro .sub{font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--soft)}
.intro .to{font-family:var(--f-display);font-style:italic;font-size:clamp(2.8rem,10vw,5.4rem);line-height:1;text-shadow:0 0 34px rgba(255,122,152,.45)}

.stage{position:fixed;left:0;right:0;bottom:0;padding:0 20px calc(env(safe-area-inset-bottom,0px) + 5vh);display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;pointer-events:none}
.msg{font-family:var(--f-display);font-size:clamp(1.35rem,4.6vw,2.15rem);line-height:1.2;max-width:26ch;text-wrap:balance;min-height:3.6em;display:flex;align-items:flex-end;justify-content:center;opacity:0;transform:translateY(10px);transition:opacity .6s ease,transform .6s ease;text-shadow:0 2px 20px rgba(20,10,28,.95),0 0 4px rgba(20,10,28,.8)}
.msg.show{opacity:1;transform:none}
.msg em{color:var(--rose)}
.extra{font-size:15px;color:var(--soft);line-height:1.5;max-width:36ch;opacity:0;transition:opacity .8s ease .4s;text-shadow:0 1px 10px rgba(20,10,28,.9)}
.extra.show{opacity:1}
.extra b{color:var(--gold);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:6px;opacity:.8}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.22);transition:background .3s}
.dots i.on{background:var(--rose)}
.hint{font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--ink);background:rgba(20,10,28,.72);padding:8px 16px;border-radius:999px;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}

/* carta */
.letterWrap{position:fixed;inset:0;background:rgba(14,6,20,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 28px) 16px calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;justify-content:center;align-items:flex-start;opacity:0;transition:opacity .6s ease;z-index:5}
.letterWrap.show{opacity:1}
.letterWrap[hidden]{display:none}
.letter{position:relative;width:100%;max-width:620px;background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:56px clamp(22px,7vw,64px) 40px;box-shadow:0 30px 80px rgba(0,0,0,.5);transform:translateY(24px) rotate(-.6deg);transition:transform .7s cubic-bezier(.2,.8,.2,1);user-select:text;-webkit-user-select:text}
.letterWrap.show .letter{transform:none}
.letter::before{content:"";position:absolute;inset:10px;border:1px solid rgba(160,90,110,.22);border-radius:2px;pointer-events:none}
.pressed{position:absolute;top:-34px;right:clamp(14px,6vw,40px);width:76px;height:auto;transform:rotate(14deg);filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.letter .date{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-soft);margin-bottom:22px}
.letter h2{font-family:var(--f-display);font-style:italic;font-weight:400;font-size:clamp(2rem,6vw,2.7rem);line-height:1.1;margin-bottom:18px}
.letter p{font-family:var(--f-body);font-size:clamp(1.05rem,3.6vw,1.2rem);line-height:1.7;max-width:60ch;margin-bottom:1em;text-wrap:pretty}
.letter .close-line{font-family:var(--f-body);font-style:italic;margin-top:28px;margin-bottom:4px}
.letter .sign{font-family:var(--f-display);font-style:italic;font-size:clamp(1.8rem,5.5vw,2.3rem);color:#b23a5a}
.letter .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px;padding-top:20px;border-top:1px solid rgba(160,90,110,.22)}
.btn{font:inherit;font-family:var(--f-ui);font-size:14px;font-weight:700;border-radius:999px;padding:10px 20px;cursor:pointer;border:1.5px solid #b23a5a;background:#b23a5a;color:#fff}
.btn.ghost{background:transparent;color:#b23a5a}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.hint{animation:none}.letter{transition:none}}
</style>
</head>
<body>

<canvas id="c" role="img" aria-label="Un jardín de tulipanes que forma un corazón. Toca para continuar."></canvas>

<div class="intro" id="intro">
  <div class="sub">Un jardín para ti</div>
  <div class="to" id="introName"></div>
</div>

<div class="stage">
  <div class="msg" id="msg" aria-live="polite"></div>
  <div class="extra" id="extra"></div>
  <div class="dots" id="dots" aria-hidden="true"></div>
  <div class="hint" id="hint">Toca la pantalla</div>
</div>

<div class="letterWrap" id="letterWrap" hidden>
  <article class="letter" role="dialog" aria-modal="true" aria-labelledby="lt">
    <img class="pressed" id="pressed" alt="">
    <div class="date" id="ldate"></div>
    <h2 id="lt"></h2>
    <div id="lbody"></div>
    <p class="close-line" id="lclose"></p>
    <div class="sign" id="lsign"></div>
    <div class="actions">
      <button class="btn" type="button" id="again">Verlo otra vez</button>
      <button class="btn ghost" type="button" id="closeLetter">Volver al jardín</button>
    </div>
  </article>
</div>

<script>
/* ============================================================
   ✏️  EDITA AQUÍ — todo lo personal está en este bloque
   ============================================================ */
const CONFIG = {
  nombre: "mi amor",                 // aparece al inicio

  juntosDesde: "",                   // AAAA-MM-DD (boda o inicio). "" para ocultar el contador
  textoContador: "días a tu lado, y todos los que nos faltan.",

  // Un mensaje por toque. *Asteriscos* resaltan palabras.
  mensajes: [
    "Hay algo que quiero decirte, y quería hacerlo de una forma diferente…",
    "Desde que llegaste a mi vida, todo tiene *más color*. Hasta los días normales se sienten especiales.",
    "Eres mi lugar favorito: mi calma cuando todo va rápido y mi risa cuando más la necesito.",
    "Admiro tu fuerza, tu ternura y la forma en que cuidas de todo lo que amas.",
    "Cada día a tu lado confirma lo que supe desde el principio: *quiero envejecer contigo*.",
    "Si tuviera que elegir otra vez, te elegiría a ti. *Mil veces*, sin dudarlo.",
  ],

  final: "Te amo",                   // lo que forman los tulipanes (corto se ve mejor)

  carta: {
    saludo: "Mi amor:",
    parrafos: [
      "Quería regalarte algo que no se pudiera envolver ni guardar en un cajón. Algo que pudieras abrir cuando quisieras y que te recordara, con flores que nunca se marchitan, lo que siento por ti.",
      "Gracias por elegirme todos los días. Por tu paciencia cuando estoy cansado, por tu risa cuando a mí no me salen las ganas, y por convertir cualquier lugar en un hogar solo con estar ahí.",
      "Me gusta la vida que estamos construyendo. Me gustan las mañanas contigo, las pláticas que se alargan sin darnos cuenta, los planes que hacemos aunque luego cambien. Me gusta quién soy cuando estoy a tu lado.",
      "No sé todo lo que nos espera, pero sé con quién quiero vivirlo. Hoy, mañana y todos los días que vengan, te elijo a ti.",
    ],
    despedida: "Te amo con todo lo que soy,",
    firma: "Tu esposo",
  },
};
/* ============================================================ */

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const rnd = (a,b) => a + Math.random()*(b-a);
const lerp = (a,b,t) => a + (b-a)*t;

/* ---------- colores de tulipán: [base oscura, medio, punta clara] ---------- */
const PALETTES = [
  ["#7d1023","#d42a43","#ff8a96"],   // rojo
  ["#9c2a5c","#ea5f9b","#ffc2db"],   // rosa
  ["#b56f00","#f4b400","#ffe88f"],   // amarillo
  ["#b9a9b6","#f2ebf0","#ffffff"],   // blanco
  ["#4c2275","#8b4fcf","#d2b0f7"],   // morado
  ["#b4410f","#f27b2c","#ffc290"],   // naranja
  ["#a3203f","#f0597a","#ffd9a8"],   // coral bicolor
];
const WEIGHTS = [5,5,3,2,3,3,3];

/* ---------- sprites detallados (se dibujan una vez) ---------- */
const SP = 128; // resolución de cada sprite
function makeHead(p){
  const c = document.createElement("canvas"); c.width = c.height = SP;
  const g = c.getContext("2d"); g.scale(SP/64, SP/64);
  const grad = (dark=0) => { const l = g.createLinearGradient(0,58,0,6); l.addColorStop(0, p[0]); l.addColorStop(.55 - dark*.15, p[1]); l.addColorStop(1, p[2]); return l; };
  // pétalo trasero
  g.beginPath(); g.moveTo(32,55); g.bezierCurveTo(19,50,21,20,32,7); g.bezierCurveTo(43,20,45,50,32,55); g.closePath();
  g.fillStyle = grad(1); g.fill();
  g.globalAlpha = .25; g.fillStyle = p[0]; g.fill(); g.globalAlpha = 1;
  // pétalo izquierdo
  g.beginPath(); g.moveTo(32,58); g.bezierCurveTo(15,56,8,34,17,11); g.bezierCurveTo(26,19,35,35,35,56); g.closePath();
  g.fillStyle = grad(); g.fill();
  // pétalo derecho
  g.beginPath(); g.moveTo(32,58); g.bezierCurveTo(49,56,56,34,47,11); g.bezierCurveTo(38,19,29,35,29,56); g.closePath();
  g.fillStyle = grad(); g.fill();
  // sombra donde se cruzan
  g.beginPath(); g.moveTo(32,57); g.bezierCurveTo(30,44,31,32,32,24); g.bezierCurveTo(33,32,34,44,32,57);
  g.fillStyle = "rgba(0,0,0,.18)"; g.fill();
  // venas
  g.strokeStyle = "rgba(0,0,0,.14)"; g.lineWidth = .7;
  g.beginPath(); g.moveTo(22,50); g.quadraticCurveTo(18,32,19,16); g.stroke();
  g.beginPath(); g.moveTo(42,50); g.quadraticCurveTo(46,32,45,16); g.stroke();
  // brillo
  g.strokeStyle = "rgba(255,255,255,.45)"; g.lineWidth = 1.6; g.lineCap = "round";
  g.beginPath(); g.moveTo(21,46); g.quadraticCurveTo(17,30,20,17); g.stroke();
  g.strokeStyle = "rgba(255,255,255,.25)"; g.lineWidth = 1;
  g.beginPath(); g.moveTo(40,44); g.quadraticCurveTo(43,32,42,22); g.stroke();
  return c;
}
function makeStem(){
  const c = document.createElement("canvas"); c.width = SP; c.height = SP*2;
  const g = c.getContext("2d"); g.scale(SP/64, SP/64);
  // tallo
  const sg = g.createLinearGradient(28,0,36,0); sg.addColorStop(0,"#2f6b2c"); sg.addColorStop(.5,"#5fae55"); sg.addColorStop(1,"#2f6b2c");
  g.strokeStyle = sg; g.lineWidth = 3.2; g.lineCap = "round";
  g.beginPath(); g.moveTo(32,54); g.bezierCurveTo(31,80,35,100,33,127); g.stroke();
  // hojas
  const leaf = (pts, flip) => {
    const lg = g.createLinearGradient(flip?56:8, 70, 33, 125);
    lg.addColorStop(0,"#8fd27c"); lg.addColorStop(.6,"#4b9a45"); lg.addColorStop(1,"#2b5f29");
    g.beginPath(); g.moveTo(...pts[0]); g.bezierCurveTo(...pts[1], ...pts[2], ...pts[3]); g.bezierCurveTo(...pts[4], ...pts[5], ...pts[0]); g.closePath();
    g.fillStyle = lg; g.fill();
    g.strokeStyle = "rgba(20,60,20,.35)"; g.lineWidth = .7;
    g.beginPath(); g.moveTo(...pts[0]); g.quadraticCurveTo(...pts[6], ...pts[3]); g.stroke();
  };
  leaf([[33,124],[18,112],[8,92],[11,72],[20,92],[30,106],[18,100]], false);
  leaf([[34,116],[48,104],[57,86],[53,64],[46,86],[37,100],[47,94]], true);
  return c;
}
function makeHeartSprite(){
  const c = document.createElement("canvas"); c.width = c.height = SP;
  const g = c.getContext("2d"); g.scale(SP/64, SP/64);
  const l = g.createLinearGradient(0,10,0,56); l.addColorStop(0,"#ff9db4"); l.addColorStop(1,"#d42a55");
  g.fillStyle = l;
  g.beginPath(); g.moveTo(32,22); g.bezierCurveTo(32,12,16,8,12,22); g.bezierCurveTo(8,36,26,46,32,54); g.bezierCurveTo(38,46,56,36,52,22); g.bezierCurveTo(48,8,32,12,32,22); g.fill();
  g.strokeStyle = "rgba(255,255,255,.5)"; g.lineWidth = 1.6; g.lineCap = "round";
  g.beginPath(); g.moveTo(18,22); g.quadraticCurveTo(19,16,25,16); g.stroke();
  return c;
}
const HEADS = PALETTES.map(makeHead);
const STEM = makeStem();
const HEARTSPR = makeHeartSprite();
function pickPalette(){ const tot = WEIGHTS.reduce((a,b)=>a+b); let r = Math.random()*tot; for (let i=0;i<WEIGHTS.length;i++){ if ((r -= WEIGHTS[i]) < 0) return i; } return 0; }

/* ---------- estado ---------- */
let W=0, H=0, DPR=1, N=0, bg=null;
let parts=[], petals=[], textTargets=[];
let mode = "garden";   // garden | heart | text
let stage = -1, lastAdvance = 0, letterReady = false;
const ptr = {x:-9999, y:-9999, active:false};

function heartXY(t){ const s=Math.sin(t); return [16*s*s*s, -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))]; }
function heartGeom(){ const size = Math.min(W*0.88, H*0.52); return {cx:W/2, cy:H*0.34, k:size/34, unit:size}; }

function makeBackground(){
  bg = document.createElement("canvas"); bg.width = W*DPR; bg.height = H*DPR;
  const g = bg.getContext("2d"); g.scale(DPR,DPR);
  const sky = g.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,"#0f0718"); sky.addColorStop(.55,"#2a1032"); sky.addColorStop(1,"#4a1838");
  g.fillStyle = sky; g.fillRect(0,0,W,H);
  // resplandor del horizonte
  const glow = g.createRadialGradient(W/2,H*1.05,10,W/2,H*1.05,Math.max(W,H)*.75);
  glow.addColorStop(0,"rgba(255,140,120,.35)"); glow.addColorStop(1,"rgba(255,140,120,0)");
  g.fillStyle = glow; g.fillRect(0,0,W,H);
  // estrellitas tenues
  for (let i=0;i<Math.round(W*H/5000);i++){ g.fillStyle = `rgba(255,240,250,${rnd(.15,.6)})`; g.beginPath(); g.arc(rnd(0,W), rnd(0,H*.6), rnd(.3,1.1), 0, Math.PI*2); g.fill(); }
}

function makeParticles(){
  N = Math.round(Math.min(620, Math.max(300, (W*H)/1300)));
  parts = [];
  const gTop = H*0.56;
  for (let i=0;i<N;i++){
    const outline = i < N*0.4;
    const t = rnd(0,Math.PI*2), [hx,hy] = heartXY(t);
    const r = outline ? rnd(.96,1.02) : Math.sqrt(Math.random())*.92;
    const depth = Math.random();                 // 0 = fondo, 1 = frente
    const isHeart = Math.random() < 0.07;
    parts.push({
      x: rnd(0,W), y: H + rnd(20,200), vx:0, vy:0,
      depth, sx: rnd(-20, W+20), sy: lerp(gTop, H*1.02, depth),
      ph: rnd(0,Math.PI*2), sp: rnd(.6,1.2),
      rx: hx*r, ry: hy*r,
      pal: pickPalette(), heart: isHeart,
      s: 0, rot: 0, stemA: 1, tilt: rnd(-.35,.35),
    });
  }
  parts.sort((a,b) => a.depth - b.depth);  // los de atrás se dibujan primero
}

function sampleText(str){
  const off = document.createElement("canvas"); off.width = W; off.height = H;
  const o = off.getContext("2d");
  let fs = Math.min(H*0.3, 270);
  const set = () => o.font = `italic ${fs}px "Instrument Serif", Georgia, serif`;
  set(); const w = o.measureText(str).width; if (w > W*0.88){ fs *= (W*0.88)/w; set(); }
  o.textAlign = "center"; o.textBaseline = "middle"; o.fillStyle = "#fff";
  o.fillText(str, W/2, H*0.34);
  const d = o.getImageData(0,0,W,H).data;
  let gap = Math.max(3, Math.round(fs/26)), pts = [];
  for (let k=0;k<8;k++){
    pts = [];
    for (let y=0;y<H;y+=gap) for (let x=0;x<W;x+=gap) if (d[(y*W+x)*4+3] > 140) pts.push([x,y]);
    if (pts.length > N*1.15 && gap < 14) gap++; else if (pts.length < N*0.7 && gap > 2) gap--; else break;
  }
  for (let i=pts.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [pts[i],pts[j]]=[pts[j],pts[i]]; }
  return {pts, size: Math.max(9, gap*2.1)};
}

function beat(t){ if (reduce) return 1; const p = t % 1.2, a=(p-.12)/.07, c=(p-.38)/.075; return 1 + .06*Math.exp(-a*a) + .035*Math.exp(-c*c); }

/* ---------- pétalos al tocar ---------- */
function burst(x, y, n=16){
  for (let i=0;i<n;i++){
    const a = rnd(0,Math.PI*2), v = rnd(1.5,5.5);
    petals.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,rot:rnd(0,6.3),vr:rnd(-.15,.15),s:rnd(6,12),life:1,ph:rnd(0,6.3),
      col: PALETTES[pickPalette()][1], heart: Math.random()<.18});
  }
  for (const p of parts){ const dx=p.x-x, dy=p.y-y, d2=dx*dx+dy*dy; if (d2<130*130){ const d=Math.sqrt(d2)||1, f=(1-d/130)*8; p.vx+=dx/d*f; p.vy+=dy/d*f; } }
}

/* ---------- escena ---------- */
const fmt = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])).replace(/\*(.+?)\*/g,"<em>$1</em>");
function setMsg(html, extra){
  const m=$("msg"), e=$("extra"); m.classList.remove("show"); e.classList.remove("show");
  setTimeout(()=>{ m.innerHTML = html; e.innerHTML = extra||""; requestAnimationFrame(()=>{ if (html) m.classList.add("show"); if (extra) e.classList.add("show"); }); }, 380);
}
function renderDots(){
  const n = CONFIG.mensajes.length;
  $("dots").innerHTML = stage < 0 || stage >= n ? "" : Array.from({length:n},(_,i)=>`<i class="${i<=stage?"on":""}"></i>`).join("");
}
function counterHTML(){
  if (!CONFIG.juntosDesde) return "";
  const days = Math.floor((Date.now() - new Date(CONFIG.juntosDesde+"T00:00"))/864e5);
  return days >= 0 ? `<b>${days.toLocaleString("es-MX")}</b> ${fmt(CONFIG.textoContador)}` : "";
}

async function toFinal(){
  try { await Promise.race([document.fonts.load(`italic 120px "Instrument Serif"`), new Promise(r=>setTimeout(r,1500))]); } catch(e){}
  const r = sampleText(CONFIG.final); textTargets = r.pts; textTargets.size = r.size;
  mode = "text";
  setMsg("", counterHTML());
  for (let i=0;i<6;i++) setTimeout(()=>burst(rnd(W*.15,W*.85), rnd(H*.15,H*.55), 10), i*170);
  setTimeout(()=>{ letterReady = true; $("hint").textContent = "Toca para abrir tu carta"; $("hint").hidden = false; }, 2200);
}

function advance(x,y){
  burst(x,y);
  const n = CONFIG.mensajes.length, now = performance.now();
  if (letterReady){ openLetter(); return; }
  if (stage >= n || now - lastAdvance < 900) return;
  lastAdvance = now; stage++;
  if (stage === 0){ $("intro").style.opacity = 0; mode = "heart"; $("hint").textContent = "Toca para continuar"; }
  if (stage < n) setMsg(fmt(CONFIG.mensajes[stage]));
  else { $("hint").hidden = true; toFinal(); }
  renderDots();
}

/* ---------- carta ---------- */
function buildLetter(){
  const L = CONFIG.carta;
  $("ldate").textContent = new Date().toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"});
  $("lt").textContent = L.saludo;
  $("lbody").innerHTML = L.parrafos.map(p=>`<p>${fmt(p)}</p>`).join("");
  $("lclose").textContent = L.despedida;
  $("lsign").textContent = L.firma;
  // tulipán "prensado" hecho con los mismos sprites
  const c = document.createElement("canvas"); c.width = SP; c.height = SP*2;
  const g = c.getContext("2d"); g.drawImage(STEM,0,0); g.drawImage(HEADS[0],0,0);
  $("pressed").src = c.toDataURL();
}
function openLetter(){
  const w = $("letterWrap"); w.hidden = false; w.scrollTop = 0;
  requestAnimationFrame(()=>w.classList.add("show"));
  setTimeout(()=>$("closeLetter").focus({preventScroll:true}), 300);
}
function closeLetter(){ const w=$("letterWrap"); w.classList.remove("show"); setTimeout(()=>w.hidden=true, 600); }
function restart(){
  closeLetter();
  stage = -1; mode = "garden"; lastAdvance = 0; letterReady = false;
  $("intro").style.opacity = 1; setMsg(""); renderDots();
  $("hint").hidden = false; $("hint").textContent = "Toca la pantalla";
  for (const p of parts){ p.vx += rnd(-10,10); p.vy += rnd(-10,4); }
}

/* ---------- dibujo ---------- */
function frame(ms){
  const t = ms/1000;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.drawImage(bg,0,0);
  ctx.setTransform(DPR,0,0,DPR,0,0);

  const G = heartGeom(), b = beat(t);
  const k = mode==="garden" ? 0.018 : mode==="heart" ? 0.03 : 0.026;
  const R = Math.min(W,H)*0.15;
  const tsz = textTargets.size || 12;

  for (let i=0;i<parts.length;i++){
    const p = parts[i];
    let tx, ty, ts, tr, tsA;
    if (mode === "heart"){
      tx = G.cx + p.rx*G.k*b; ty = G.cy + p.ry*G.k*b;
      ts = G.unit*0.064*(.75 + p.depth*.5); tr = p.tilt*.6 + Math.sin(t*1.4+p.ph)*.05; tsA = 0;
    } else if (mode === "text" && textTargets.length){
      const q = textTargets[i % textTargets.length];
      tx = q[0] + Math.sin(t*1.2+p.ph)*.7; ty = q[1] + Math.cos(t+p.ph)*.7;
      ts = tsz*(.85 + p.depth*.35); tr = p.tilt*.5; tsA = 0;
    } else {
      const sway = Math.sin(t*p.sp + p.ph + p.sx*.01);
      tx = p.sx + sway*3; ty = p.sy;
      ts = lerp(18, 40, p.depth) * Math.min(1, Math.max(.75, W/700)); tr = sway*.12; tsA = 1;
    }
    p.vx += (tx-p.x)*k; p.vy += (ty-p.y)*k;
    if (ptr.active){ const dx=p.x-ptr.x, dy=p.y-ptr.y, d2=dx*dx+dy*dy; if (d2<R*R){ const d=Math.sqrt(d2)||1, f=(1-d/R)*1.5; p.vx+=dx/d*f; p.vy+=dy/d*f; } }
    p.vx *= .85; p.vy *= .85; p.x += p.vx; p.y += p.vy;
    p.s = lerp(p.s, ts, .08); p.rot = lerp(p.rot, tr + p.vx*.02, .12); p.stemA = lerp(p.stemA, tsA, .06);

    const s = p.s; if (s < .5) continue;
    const c = Math.cos(p.rot), sn = Math.sin(p.rot);
    ctx.setTransform(c*DPR, sn*DPR, -sn*DPR, c*DPR, p.x*DPR, p.y*DPR);
    if (p.stemA > .02 && !p.heart){ ctx.globalAlpha = p.stemA; ctx.drawImage(STEM, -s/2, -s/2, s, s*2); }
    ctx.globalAlpha = mode==="garden" ? lerp(.7,1,p.depth) : 1;
    ctx.drawImage(p.heart ? HEARTSPR : HEADS[p.pal], -s/2, -s/2, s, s);
  }
  ctx.globalAlpha = 1;

  // pétalos sueltos
  for (let i=petals.length-1;i>=0;i--){
    const q = petals[i];
    q.vy += .05; q.vx = q.vx*.98 + Math.sin(t*3+q.ph)*.08; q.vy *= .985; q.x += q.vx; q.y += q.vy; q.rot += q.vr; q.life -= .011;
    if (q.life <= 0){ petals.splice(i,1); continue; }
    const c = Math.cos(q.rot), sn = Math.sin(q.rot);
    ctx.setTransform(c*DPR, sn*DPR, -sn*DPR, c*DPR, q.x*DPR, q.y*DPR);
    ctx.globalAlpha = q.life;
    if (q.heart) ctx.drawImage(HEARTSPR, -q.s/2, -q.s/2, q.s, q.s);
    else { ctx.fillStyle = q.col; ctx.beginPath(); ctx.ellipse(0,0,q.s*.32,q.s*.6,0,0,Math.PI*2); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  makeBackground();
  if (!parts.length) makeParticles();
  else { const gTop = H*.56; for (const p of parts){ p.sx = rnd(-20,W+20); p.sy = lerp(gTop, H*1.02, p.depth); } }
  if (mode === "text"){ const r = sampleText(CONFIG.final); textTargets = r.pts; textTargets.size = r.size; }
}

/* ---------- eventos ---------- */
cv.addEventListener("pointerdown", e => { ptr.x=e.clientX; ptr.y=e.clientY; ptr.active=true; advance(e.clientX, e.clientY); });
cv.addEventListener("pointermove", e => { ptr.x=e.clientX; ptr.y=e.clientY; ptr.active=true; });
cv.addEventListener("pointerup", e => { if (e.pointerType !== "mouse") ptr.active=false; });
cv.addEventListener("pointerleave", () => ptr.active=false);
addEventListener("keydown", e => {
  if (!$("letterWrap").hidden){ if (e.key==="Escape") closeLetter(); return; }
  if (e.key===" " || e.key==="Enter"){ e.preventDefault(); advance(W/2, H*.34); }
});
$("again").addEventListener("click", restart);
$("closeLetter").addEventListener("click", closeLetter);
$("letterWrap").addEventListener("click", e => { if (e.target.id==="letterWrap") closeLetter(); });
let rT; addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(resize, 120); });

$("introName").textContent = CONFIG.nombre;
document.title = "Para " + CONFIG.nombre;
buildLetter();
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
